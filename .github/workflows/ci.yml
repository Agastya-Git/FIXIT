name: FixIt CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fixit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: 1. Backend Testing & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
          
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          
      - name: Run Pytest Test Suite
        run: python -m pytest -v

  frontend-build-test:
    name: 2. Frontend Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Run Frontend Tests
        run: npm run test
        
      - name: Build Production Web Bundle
        run: npm run build

  docker-container-validation:
    name: 3. Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Validate Production Compose Configuration
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.production.yml config --quiet
          
      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t fixit-backend:latest backend
        
      - name: Build Frontend Multi-Stage Docker Image
        run: |
          docker build \
            --build-arg VITE_PUBLIC_REGISTRATION_ENABLED=true \
            --build-arg VITE_DEMO_MODE_ENABLED=false \
            -f frontend/Dockerfile -t fixit-frontend:latest frontend
            
      - name: Verify Container Artifacts
        run: docker images | grep fixit
